name: Verify pinned Git source tree trivy
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/aquasecurity/trivy.git
      upstream_sha: 239be7b2671a3c9706bbfec2ba4677210cbdcdec
      audit_slug: trivy
